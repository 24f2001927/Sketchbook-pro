# Render Blueprint Specification
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Frontend Static Web App (React 19 + TypeScript + Vite)
  # ---------------------------------------------------------------------------
  - type: web
    name: sketchbook-pro-frontend
    env: static
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

  # ---------------------------------------------------------------------------
